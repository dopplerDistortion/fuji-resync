name: Resync
options:
  bundleIdPrefix: ing.goksen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FujiKit:
    path: FujiKit
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Resync:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Support/Info.plist"
          - "Support/*.entitlements"
    dependencies:
      - package: FujiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ing.goksen.resync
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: $(RESYNC_ENTITLEMENTS)
        INFOPLIST_FILE: App/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  ResyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Resync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ing.goksen.resync.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Resync
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  Resync:
    build:
      targets:
        Resync: all
    test:
      targets:
        - ResyncUITests
