name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: FujiKit tests
        working-directory: FujiKit
        run: swift test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild -project Resync.xcodeproj -scheme Resync \
            -destination 'generic/platform=iOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build
      - name: UI tests (simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)? \(' | sed 's/ ($//')
          echo "simulator: $DEVICE"
          xcodebuild -project Resync.xcodeproj -scheme Resync \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path ui-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore
