name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Mapbox SDK's binaries are built with Swift 6.2, so the build needs Xcode 26.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: FujiKit tests
        working-directory: FujiKit
        run: swift test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      # SwiftPM in Xcode 26 sometimes fails on the Mapbox binaries with "Turf.xcframework.zip ...
      # already exists in file system", even from an empty cache: it's a race inside resolution.
      # A second resolve finds the artifact in place, so resolve on its own and try up to 3 times.
      - name: Resolve packages
        run: |
          for i in 1 2 3; do
            xcodebuild -project Resync.xcodeproj -scheme Resync -resolvePackageDependencies && exit 0
            echo "resolve attempt $i failed"; sleep 5
          done
          exit 1
      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild -project Resync.xcodeproj -scheme Resync \
            -destination 'generic/platform=iOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build
      - name: UI tests (simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)? \(' | sed 's/ ($//')
          echo "simulator: $DEVICE"
          xcodebuild -project Resync.xcodeproj -scheme Resync \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path ui-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore
