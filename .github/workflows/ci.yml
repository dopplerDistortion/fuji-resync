name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: FujiKit tests
        working-directory: FujiKit
        run: swift test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild -project Resync.xcodeproj -scheme Resync \
            -destination 'generic/platform=iOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build
